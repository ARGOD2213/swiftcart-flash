# One ALB behind CloudFront. The ALB's WAF (terraform output waf_acl_arn) only lets through requests that carry
# CloudFront's secret origin header; bot control and per-IP limits run on CloudFront, where shoppers' own IPs are
# visible. The API itself is not public: shoppers reach it through the storefront's /api/sc proxy, and only payment
# webhooks (https://<shop>/webhooks/{gateway}) are routed to it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swiftcart
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:ACCOUNT_ID:certificate/CERT_ID
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-south-1:ACCOUNT_ID:regional/webacl/swiftcart-origin/WAF_ID
    # long enough for a slow gateway call during checkout, short enough to shed stuck connections
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=30
spec:
  ingressClassName: alb
  rules:
    - host: origin.shop.example.com
      http:
        paths:
          - path: /webhooks
            pathType: Prefix
            backend: { service: { name: swiftcart-api, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: swiftcart-web, port: { number: 80 } } }
