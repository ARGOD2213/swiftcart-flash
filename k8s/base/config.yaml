apiVersion: v1
kind: Namespace
metadata:
  name: swiftcart
---
# Non-secret settings. The prod overlay fills these from `terraform output app_config`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: swiftcart-config
data:
  DB_URL: jdbc:postgresql://AURORA_ENDPOINT:5432/swiftcart?sslmode=require
  DB_USER: swiftcart
  REDIS_HOST: ELASTICACHE_ENDPOINT
  REDIS_SSL: "true"
  AWS_REGION: ap-south-1
  FULFILMENT_QUEUE_URL: https://sqs.ap-south-1.amazonaws.com/ACCOUNT_ID/swiftcart-fulfilment.fifo
  SES_FROM_ADDRESS: orders@shop.example.com
  PAYMENT_GATEWAY: razorpay
  ADMIN_EMAILS: ops@shop.example.com
  STRIPE_SUCCESS_URL: https://shop.example.com/orders/{ORDER_ID}
  STRIPE_CANCEL_URL: https://shop.example.com/orders/{ORDER_ID}
  SCALING_MIN_REPLICAS: "2"
  SCALING_MAX_REPLICAS: "40"
  SCALING_RPS_PER_POD: "150"
  SCALING_LEAD: 15m
  TRACING_ENABLED: "true"
  TRACING_SAMPLE: "0.05"
  OTLP_TRACES_ENDPOINT: http://otel-collector.observability:4318/v1/traces
---
# Secrets come from AWS Secrets Manager through the External Secrets Operator; nothing secret lives in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: swiftcart-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: swiftcart-secrets
  dataFrom:
    - extract:
        key: swiftcart/prod
