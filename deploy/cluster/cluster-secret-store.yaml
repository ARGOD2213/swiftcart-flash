# Installed once per cluster, after the External Secrets Operator. The operator's service account carries the
# IRSA role from infra/terraform/iam.tf (irsa_role_arns.external_secrets), so no credentials are configured here.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
