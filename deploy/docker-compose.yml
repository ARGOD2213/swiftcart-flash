# SwiftCart Flash locally.
#
#   docker compose -f deploy/docker-compose.yml up --build
#   open http://localhost:3000            storefront (sign up, then open a drop)
#   scripts/demo.sh                        walks through every edge case against the running stack
#
# Payments go through the built-in simulator (Razorpay-format signed webhooks). The warehouse is a WireMock stub.

name: swiftcart

x-app-env: &app-env
  DB_URL: jdbc:postgresql://postgres:5432/swiftcart
  DB_USER: swiftcart
  DB_PASSWORD: swiftcart
  REDIS_HOST: redis
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT: http://localstack:4566
  FULFILMENT_QUEUE_URL: http://localstack:4566/000000000000/swiftcart-fulfilment.fifo
  WAREHOUSE_URL: http://warehouse:8080

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swiftcart
      POSTGRES_USER: swiftcart
      POSTGRES_PASSWORD: swiftcart
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftcart -d swiftcart"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # inventory must never be evicted to make room: refuse writes instead (same as the ElastiCache parameter group)
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ap-south-1
    ports: ["4566:4566"]
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name swiftcart-fulfilment.fifo"]
      interval: 5s
      retries: 30

  warehouse:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--disable-banner"]
    volumes:
      - ./wiremock:/home/wiremock:ro

  api:
    build: ../api
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: dev
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      localstack: { condition: service_healthy }

  worker:
    build: ../api
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: dev,worker
    depends_on:
      api: { condition: service_started }

  web:
    build: ../web
    environment:
      API_URL: http://api:8080
      ALLOW_INSECURE_COOKIES: "1"
      SIMULATOR_ENABLED: "1"
    ports: ["3000:3000"]
    depends_on: [api]
