name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · build + Testcontainers tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # unit tests + integration tests against real Postgres, Redis and LocalStack (SQS FIFO), WireMock for gateways
      - run: mvn -B -ntp verify -Dsurefire.useFile=true 2>&1 | tee maven.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Test summary
        if: always()
        run: bash ../.github/scripts/test-summary.sh target/surefire-reports target/failsafe-reports
      - name: Annotate failures
        if: failure()
        run: bash ../.github/scripts/annotate-maven.sh maven.log target/surefire-reports target/failsafe-reports
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-test-reports
          path: |
            api/target/surefire-reports/
            api/target/failsafe-reports/
          if-no-files-found: ignore

  web:
    name: Web · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Annotate failures
        if: failure()
        run: |
          body=$(grep -E 'error|Error|failed' -A3 build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=web build::${body}"

  e2e:
    name: End to end · compose + demo.sh + k6 load test
    needs: [api]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # the whole stack, built from this commit: Postgres, Redis, LocalStack SQS FIFO, warehouse stub, API, worker
      - run: docker compose -f deploy/docker-compose.yml up -d --build postgres redis localstack warehouse api worker
      - name: Edge cases (scripts/demo.sh)
        run: scripts/demo.sh 2>&1 | tee demo.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Load test (1,500 shoppers, 300 pairs) + audit
        run: scripts/loadtest.sh 2>&1 | tee loadtest.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Summary
        if: always()
        run: |
          for f in demo.log loadtest.log; do
            [ -f "$f" ] || continue
            sed -i 's/\x1b\[[0-9;]*m//g' "$f"
            { echo "### $f"; echo '```'; tail -60 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          [ -f demo.log ] && echo "::notice title=demo.sh::$(grep -E '✓|✗|All checks' demo.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          [ -f loadtest.log ] && echo "::notice title=load test::$(grep -E 'drop load-|sold |✓|✗' loadtest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          exit 0
      - name: Annotate failures
        if: failure()
        run: |
          for svc in api worker localstack; do
            body=$(docker compose -f deploy/docker-compose.yml logs --no-color --tail 60 "$svc" 2>&1 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=compose logs: $svc::${body:0:6000}"
          done
          [ -f demo.log ] && echo "::error title=demo.sh::$(tail -30 demo.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          [ -f loadtest.log ] && echo "::error title=loadtest::$(tail -40 loadtest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          exit 0
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  images:
    name: Images · ${{ matrix.app }}
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # pull requests only build; main publishes ghcr.io/argod2213/swiftcart-<app>:sha-<commit>
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/argod2213/swiftcart-${{ matrix.app }}:sha-${{ steps.meta.outputs.short }}
            ghcr.io/argod2213/swiftcart-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
